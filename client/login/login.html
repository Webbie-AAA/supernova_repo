<!doctype html>
<html lang="en">
  <head>
    <title>Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css" />
    <script src="./login.js" defer></script>
  </head>
  <body>
    <nav class="navbar py-3 px-4">
      <a href="../homepage/homepage.html" class="navbar-title mb-0">
        The Great Escape
      </a>

      <div class="d-flex align-items-center gap-4">
        <a href="#" class="nav-link">About</a>
        <a href="../register/register.html" class="nav-link">Sign Up Here</a>
      </div>
    </nav>
    <div class="container">
      <section id="login_page">
        <div class="center">
          <h1>Login</h1>
          <form id="login_form">
            <div class="txt_field">
              <input type="email" name="email" id="user_email" required />
              <label>Email</label>
            </div>
            <div class="txt_field">
              <input
                type="password"
                name="password"
                id="user_password"
                required
              />
              <label>Password</label>
            </div>
            <p id="login-error" role="alert"></p>
            <input name="submit" type="submit" value="Login" />
            <div class="signup_link">
              Don't have an Account?
              <a href="../register/register.html">Register Here</a>
            </div>
          </form>
        </div>
      </section>
    </div>
    <footer>
      <a href="mailto:contact@example.com">Contact Us</a>
    </footer>
  </body>
</html>
