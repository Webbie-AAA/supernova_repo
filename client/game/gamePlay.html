<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./gamePlay.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Metamorphous&display=swap" rel="stylesheet">

    <title>The Great Escape</title>
</head>


<body>
    <nav class="navbar py-3 px-4">
        <a href="homepage.html" class="navbar-title mb-0"> The Great Escape </a> <!--UPDATE LINK HERE-->
        <div class="d-flex align-items-center gap-4">
            <span class="nav-link">Student</span>
            <a href="homepage.html" class="nav-link">Log Out</a>
        </div>
    </nav>

    <main class="game-play-section">
        <div class="quiz-card">

            <section id="question-header">
                <h2>Question 1 of 10</h2>
                <!-- Update the width from JS as the student progresses (10% per question) -->
                <div class="progress-track" aria-hidden="true">
                    <div class="progress-fill" style="width: 10%;"></div>
                </div>
            </section>

            <section id="question-section">
                On what day did the Battle of Hastings take place?
            </section>

            <section id="multiple-choice-section">
                <form role="radiogroup" aria-labelledby="question-section">
                    <!-- All four radios share one name, so only one can be picked -->
                    <label class="option" for="option-A">
                        <input type="radio" id="option-A" name="answer" value="A">
                        <span class="option-letter">A</span>
                        <span class="option-text">25 September 1066</span>
                    </label>

                    <label class="option" for="option-B">
                        <input type="radio" id="option-B" name="answer" value="B">
                        <span class="option-letter">B</span>
                        <span class="option-text">14 October 1066</span>
                    </label>

                    <label class="option" for="option-C">
                        <input type="radio" id="option-C" name="answer" value="C">
                        <span class="option-letter">C</span>
                        <span class="option-text">25 December 1066</span>
                    </label>

                    <label class="option" for="option-D">
                        <input type="radio" id="option-D" name="answer" value="D">
                        <span class="option-letter">D</span>
                        <span class="option-text">5 January 1066</span>
                    </label>
                </form>
            </section>

            <section id="next-question-section">
                <button id="next-btn" type="button">Next</button>
            </section>

        </div>
    </main>
    <footer>
        <a href="mailto:contact@example.com">Contact us</a>
    </footer>
</body>

</html>
