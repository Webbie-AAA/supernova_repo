<!doctype html>
<html lang="en">
  <head>
    <title>Sign Up / Registration Form</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    \
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="register.css" />
    <script defer src="./register.js"></script>
  </head>
  <body>
    <div class="container">
      <nav class="navbar py-3 px-4">
        <a href="../homepage/homepage.html" class="navbar-title mb-0">
          The Great Escape
        </a>

        <div class="d-flex align-items-center gap-4">
          <span class="nav-link">Student</span>
          <a href="../login/login.html" class="nav-link">Log In</a>
        </div>
      </nav>
      <section id="registration_page">
        <div class="center">
          <h1>Sign Up Here!</h1>
          <form id="register_form">
            <div class="txt_field">
              <input type="text" name="first_name" id="first_name" required />

              <label>First Name</label>
            </div>
            <div class="txt_field">
              <input type="text" name="last_name" id="last_name" required />

              <label>Last Name</label>
            </div>
            <div class="txt_field">
              <label>Email</label>

              <input type="email" name="email" id="email" required />
            </div>
            <div class="txt_field">
              <input type="password" name="password" id="password" required />

              <label>Password</label>
            </div>
            <div class="txt_field">
              <input
                type="password"
                name="confirm password"
                id="confirm_password"
                required
              />

              <label>Confirm Password</label>
            </div>
            <button name="submit" type="submit" value="Register">
              Register
            </button>
            <div class="signup_link">
              Have an Account ? <a href="../login/login.html">Login Here</a>
            </div>
          </form>
        </div>
      </section>
    </div>
    <footer>
      <a href="mailto:contact@example.com">Contact Us</a>
    </footer>
  </body>
</html>
